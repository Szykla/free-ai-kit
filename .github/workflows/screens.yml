# The screenshot check (tests/visual/README.md): the key pages against main's on
# every pull request. Red until every changed page has a blind review and an
# explicit accept for this pull request's sources. Nothing is uploaded.
name: Screens

on:
  pull_request:

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Main and the pull request's head, the two parents of the merge.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tests/visual
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests/visual
      # Playwright's own Chromium, as in a cloud session (the runner's Google Chrome
      # drew pages a pixel off more often).
      - run: npx --prefix tests/visual playwright install --only-shell chromium
      - name: Pages against main
        env:
          VISUAL_SOURCE: ${{ github.event.pull_request.head.sha }}
          VISUAL_PR_TITLE: ${{ github.event.pull_request.title }}
          VISUAL_PR_BODY: ${{ github.event.pull_request.body }}
        run: node tests/visual/visual.mjs HEAD^1
