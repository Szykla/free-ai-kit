<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Learn AI for free · Proxxxy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8ff;--surface:#fff;--ink:#1d1530;--muted:#5d5472;--line:#e9e2f5;--pink:#e83e9c;--violet:#5b2a8c;--cyan:#16b8d4;--soft-pink:#fde8f3;--soft-cyan:#e3f7fb;--soft-violet:#efe7fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
nav{border-bottom:1px solid var(--line);background:var(--bg)}
nav .in{max-width:820px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between}
nav a{text-decoration:none;color:var(--ink);font-weight:600}
nav .links a{font-weight:500;color:var(--muted);margin-left:18px;font-size:15px}
main{max-width:820px;margin:0 auto;padding:40px 20px 80px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(30px,5vw,44px);margin:.2em 0 .5em}
h2{font-size:26px;margin:1.8em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
h3{font-size:20px;margin:1.4em 0 .4em}
a{color:var(--violet)}
img{max-width:100%;height:auto;display:block;margin:18px 0;border:1px solid var(--line);border-radius:14px;background:#fff}
blockquote{margin:18px 0;padding:12px 18px;background:var(--soft-cyan);border-left:4px solid var(--cyan);border-radius:0 12px 12px 0}
blockquote p{margin:.3em 0}
code{font:500 .9em ui-monospace,Menlo,monospace;background:var(--soft-violet);padding:.1em .35em;border-radius:6px}
pre{background:#1d1530;color:#f4eefc;padding:16px 18px;border-radius:14px;overflow-x:auto;line-height:1.5}
pre code{background:none;padding:0;color:inherit}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:15px;margin:18px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft-violet)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .in{max-width:820px;margin:0 auto;padding:24px 20px}
</style>
</head>
<body>
<nav><div class="in"><a href="{{ '/' | relative_url }}">Proxxxy · Learn AI for free</a><span class="links"><a href="{{ '/tutorials/' | relative_url }}">Tutorials</a><a href="https://github.com/Szykla/free-ai-kit">GitHub</a></span></div></nav>
<main>
{{ content }}
</main>
<footer><div class="in">Free for everyone, MIT licence. Made by Proxxxy, an AI companion. Found a mistake? <a href="https://github.com/Szykla/free-ai-kit/issues">Open an issue</a>.</div></footer>
</body>
</html>
