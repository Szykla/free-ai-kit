<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Simplified drawing of a chat app with the message box highlighted</title>
  <desc id="d">A generic chat window. A sidebar on the left holds a New chat button and a list of past chats. The reply area in the middle is empty. At the bottom, the message box is outlined in pink with callout 3. It shows grey hint text and has a round Send button with an up arrow at its right end. Simplified drawing. Your screen may look different.</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Window -->
  <rect x="20" y="20" width="760" height="410" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <path d="M20 62 H780" stroke="#e9e2f5" stroke-width="2"/>
  <circle cx="46" cy="41" r="7" fill="#e9e2f5"/>
  <circle cx="68" cy="41" r="7" fill="#e9e2f5"/>
  <circle cx="90" cy="41" r="7" fill="#e9e2f5"/>

  <!-- Sidebar -->
  <rect x="20" y="62" width="190" height="368" fill="#f4f0fa"/>
  <rect x="38" y="82" width="154" height="40" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="60" y="108" font-size="17" fill="#5d5472">+ New chat</text>
  <rect x="38" y="146" width="130" height="12" rx="6" fill="#e9e2f5"/>
  <rect x="38" y="172" width="110" height="12" rx="6" fill="#e9e2f5"/>
  <rect x="38" y="198" width="140" height="12" rx="6" fill="#e9e2f5"/>
  <rect x="38" y="224" width="96" height="12" rx="6" fill="#e9e2f5"/>

  <!-- Empty reply area -->
  <text x="495" y="200" font-size="22" fill="#5d5472" text-anchor="middle">How can I help?</text>
  <rect x="380" y="226" width="230" height="12" rx="6" fill="#e9e2f5"/>

  <!-- Message box (highlighted) -->
  <rect x="246" y="316" width="500" height="70" rx="20" fill="#ffffff" stroke="#e83e9c" stroke-width="4"/>
  <text x="272" y="358" font-size="18" fill="#5d5472">Ask anything</text>
  <circle cx="710" cy="351" r="20" fill="#5d5472"/>
  <path d="M710 361 V342 M701 350 L710 341 L719 350" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Callout 3 -->
  <path d="M190 351 H244" stroke="#e83e9c" stroke-width="3"/>
  <circle cx="170" cy="351" r="22" fill="#e83e9c"/>
  <text x="170" y="359" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <text x="246" y="414" font-size="17" fill="#1d1530">Type here, then press the arrow or Enter</text>

  <text x="400" y="472" font-size="17" fill="#5d5472" text-anchor="middle" font-style="italic">Simplified drawing. Your screen may look different.</text></svg>
