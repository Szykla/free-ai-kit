<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Simplified drawing: where the temporary chat toggle usually sits</title>
  <desc id="d">A generic, empty new chat page. Near the top right corner, a small pill-shaped toggle with a dashed speech-bubble icon and the word Temporary is outlined in pink with callout 5. A note says that in Claude this is a ghost icon, and in Gemini it sits next to New chat. The message box is at the bottom. Simplified drawing. Your screen may look different.</desc>
  <rect width="800" height="440" fill="#ffffff"/>

  <rect x="20" y="20" width="760" height="340" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <path d="M20 62 H780" stroke="#e9e2f5" stroke-width="2"/>
  <circle cx="46" cy="41" r="7" fill="#e9e2f5"/>
  <circle cx="68" cy="41" r="7" fill="#e9e2f5"/>
  <circle cx="90" cy="41" r="7" fill="#e9e2f5"/>

  <!-- Sidebar -->
  <rect x="20" y="62" width="170" height="298" fill="#f4f0fa"/>
  <rect x="36" y="80" width="138" height="38" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="54" y="105" font-size="17" fill="#5d5472">+ New chat</text>
  <rect x="36" y="140" width="120" height="12" rx="6" fill="#e9e2f5"/>
  <rect x="36" y="166" width="100" height="12" rx="6" fill="#e9e2f5"/>
  <rect x="36" y="192" width="126" height="12" rx="6" fill="#e9e2f5"/>

  <!-- Temporary toggle (highlighted) -->
  <rect x="604" y="78" width="156" height="44" rx="22" fill="#ffffff" stroke="#e83e9c" stroke-width="4"/>
  <path d="M626 92 h24 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-14 l-6 6 v-6 h-4 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 z" fill="none" stroke="#5d5472" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="666" y="107" font-size="17" fill="#1d1530">Temporary</text>

  <!-- Callout 5 -->
  <path d="M560 100 H602" stroke="#e83e9c" stroke-width="3"/>
  <circle cx="540" cy="100" r="22" fill="#e83e9c"/>
  <text x="540" y="108" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- Empty chat -->
  <text x="485" y="200" font-size="22" fill="#5d5472" text-anchor="middle">New chat</text>
  <rect x="236" y="276" width="500" height="58" rx="18" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="260" y="311" font-size="18" fill="#5d5472">Ask anything</text>
  <circle cx="704" cy="305" r="17" fill="#e9e2f5"/>

  <text x="40" y="394" font-size="17" fill="#1d1530">Claude: a ghost icon in the top right. Gemini: next to New chat.</text>
  <text x="400" y="426" font-size="17" fill="#5d5472" text-anchor="middle" font-style="italic">Simplified drawing. Your screen may look different.</text></svg>
