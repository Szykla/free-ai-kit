<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The jagged frontier</title>
  <desc id="d">A jagged line encloses an area labelled Inside the frontier: AI does well here. Dots inside are labelled draft a post, summarise, brainstorm and reformat. Just outside one spike sits a pink dot labelled a task that looked just as hard. On the right, two bars compare results on that outside task in a 2023 study: about 84.5% correct without AI, about 60 to 70% with AI. Source: Dell'Acqua and others, 2023.</desc>
  <rect width="800" height="440" fill="#fbf8ff"/>

  <!-- Jagged region -->
  <path d="M40 380 L40 150 L100 200 L140 70 L200 170 L250 90 L290 210 L350 120 L400 250 L440 180 L460 380 Z" fill="#e3f7fb" stroke="#16b8d4" stroke-width="3" stroke-linejoin="round"/>
  <text x="60" y="360" font-size="18" font-weight="700" fill="#1d1530">Inside: AI does well</text>

  <g font-size="17" fill="#1d1530">
    <circle cx="90" cy="250" r="8" fill="#16b8d4"/><text x="104" y="256">Draft a post</text>
    <circle cx="200" cy="300" r="8" fill="#16b8d4"/><text x="214" y="306">Summarise</text>
    <circle cx="160" cy="200" r="8" fill="#16b8d4"/><text x="174" y="206">Brainstorm</text>
    <circle cx="300" cy="260" r="8" fill="#16b8d4"/><text x="314" y="266">Reformat</text>
  </g>

  <!-- Outside task -->
  <circle cx="330" cy="70" r="10" fill="#e83e9c"/>
  <text x="348" y="64" font-size="17" fill="#1d1530">A task that looked</text>
  <text x="348" y="86" font-size="17" fill="#1d1530">just as hard</text>

  <!-- Stats panel -->
  <rect x="500" y="110" width="284" height="270" rx="16" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="520" y="142" font-size="18" font-weight="700" fill="#1d1530">On the outside task:</text>
  <text x="520" y="166" font-size="16" fill="#5d5472">share of correct answers</text>
  <text x="520" y="206" font-size="17" fill="#1d1530">Without AI</text>
  <rect x="520" y="216" width="183" height="28" rx="6" fill="#5b2a8c"/>
  <text x="712" y="237" font-size="17" font-weight="700" fill="#1d1530">84.5%</text>
  <text x="520" y="282" font-size="17" fill="#1d1530">With AI</text>
  <rect x="520" y="292" width="130" height="28" rx="6" fill="#e83e9c"/>
  <rect x="650" y="292" width="22" height="28" rx="0" fill="#e83e9c" opacity="0.45"/>
  <text x="680" y="313" font-size="17" font-weight="700" fill="#1d1530">60-70%</text>
  <text x="520" y="356" font-size="16" fill="#5d5472">Consultants, GPT-4, 2023</text>

  <text x="40" y="420" font-size="16" fill="#5d5472">Source: Dell'Acqua and others, "Navigating the Jagged Technological Frontier", 2023.</text></svg>
