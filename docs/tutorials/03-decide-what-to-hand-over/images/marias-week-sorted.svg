<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What we'll make: Maria's week sorted into three columns</title>
  <desc id="d">Three columns. AI does it: price list into a table; five Instagram post ideas; common questions in last month's messages. AI helps: draft customer replies; weekly Instagram caption; flour and butter amounts; website About page draft; summarise supplier terms; Spanish door sign. I do it: place and pay the Monday order; answer allergy questions; decide the staff rota; taste-test the rye loaf.</desc>
  <rect width="800" height="460" fill="#fbf8ff"/>

  <!-- Column headers -->
  <rect x="16" y="16" width="248" height="52" rx="12" fill="#16b8d4"/>
  <rect x="276" y="16" width="248" height="52" rx="12" fill="#5b2a8c"/>
  <rect x="536" y="16" width="248" height="52" rx="12" fill="#e83e9c"/>
  <g font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="140" y="49">AI does it</text>
    <text x="400" y="49">AI helps</text>
    <text x="660" y="49">I do it</text>
  </g>

  <!-- AI does it -->
  <g fill="#e3f7fb" stroke="#16b8d4" stroke-width="2">
    <rect x="16" y="82" width="248" height="46" rx="10"/>
    <rect x="16" y="138" width="248" height="46" rx="10"/>
    <rect x="16" y="194" width="248" height="46" rx="10"/>
  </g>
  <g font-size="17" fill="#1d1530">
    <text x="32" y="111">Price list into a table</text>
    <text x="32" y="167">5 Instagram post ideas</text>
    <text x="32" y="223">Common questions list</text>
  </g>

  <!-- AI helps -->
  <g fill="#ffffff" stroke="#5b2a8c" stroke-width="2">
    <rect x="276" y="82" width="248" height="46" rx="10"/>
    <rect x="276" y="138" width="248" height="46" rx="10"/>
    <rect x="276" y="194" width="248" height="46" rx="10"/>
    <rect x="276" y="250" width="248" height="46" rx="10"/>
    <rect x="276" y="306" width="248" height="46" rx="10"/>
    <rect x="276" y="362" width="248" height="46" rx="10"/>
  </g>
  <g font-size="17" fill="#1d1530">
    <text x="292" y="111">Draft customer replies</text>
    <text x="292" y="167">Weekly Instagram caption</text>
    <text x="292" y="223">Flour and butter amounts</text>
    <text x="292" y="279">Website About page draft</text>
    <text x="292" y="335">Summarise supplier terms</text>
    <text x="292" y="391">Spanish door sign</text>
  </g>

  <!-- I do it -->
  <g fill="#fde8f3" stroke="#e83e9c" stroke-width="2">
    <rect x="536" y="82" width="248" height="46" rx="10"/>
    <rect x="536" y="138" width="248" height="46" rx="10"/>
    <rect x="536" y="194" width="248" height="46" rx="10"/>
    <rect x="536" y="250" width="248" height="46" rx="10"/>
  </g>
  <g font-size="17" fill="#1d1530">
    <text x="552" y="111">Place the Monday order</text>
    <text x="552" y="167">Answer allergy questions</text>
    <text x="552" y="223">Decide the staff rota</text>
    <text x="552" y="279">Taste-test the rye loaf</text>
  </g>

  <text x="16" y="440" font-size="17" fill="#5d5472">I glance.</text>
  <text x="276" y="440" font-size="17" fill="#5d5472">I check and finish.</text>
  <text x="536" y="440" font-size="17" fill="#5d5472">Sends, spends or needs me.</text></svg>
