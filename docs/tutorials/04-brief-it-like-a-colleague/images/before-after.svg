<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" role="img" aria-labelledby="t d">
  <title id="t">One-line request compared with a four-part brief</title>
  <desc id="d">Two panels compared. Left: a one-line request leads to a generic post with invented details. Right: a four-part brief leads to three short drafts that use only the facts given.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1530; }
    .h { font-size: 22px; font-weight: 700; }
    .b { font-size: 17px; }
    .m { font-size: 16px; fill: #5d5472; }
    .lab { font-size: 16px; font-weight: 700; fill: #5b2a8c; }
  </style>
  <rect width="800" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="370" height="380" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="40" y="58" class="h">Before: one line</text>
  <rect x="40" y="80" width="330" height="60" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="56" y="116" class="b">"Write a post about rye bread."</text>
  <path d="M205 152 L205 186" stroke="#5d5472" stroke-width="3"/>
  <path d="M195 182 L205 198 L215 182 Z" fill="#5d5472"/>
  <rect x="40" y="208" width="330" height="170" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="56" y="240" class="lab">Reply</text>
  <text x="56" y="268" class="b">Generic words anyone could post</text>
  <rect x="52" y="284" width="300" height="34" rx="8" fill="#fde8f3" stroke="#e83e9c" stroke-width="2"/>
  <text x="64" y="307" class="b">Invented: "baked every morning"</text>
  <text x="56" y="348" class="b">Five hashtags, no day or time</text>
  <rect x="410" y="20" width="370" height="380" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="430" y="58" class="h">After: four-part brief</text>
  <rect x="430" y="80" width="330" height="60" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="446" y="116" class="b">Task · Context · Output · Limits</text>
  <path d="M595 152 L595 186" stroke="#5b2a8c" stroke-width="3"/>
  <path d="M585 182 L595 198 L605 182 Z" fill="#5b2a8c"/>
  <rect x="430" y="208" width="330" height="170" rx="10" fill="#e3f7fb" stroke="#16b8d4" stroke-width="2"/>
  <text x="446" y="240" class="lab">Reply</text>
  <text x="446" y="268" class="b">3 short drafts to choose from</text>
  <text x="446" y="300" class="b">Only the facts you gave</text>
  <text x="446" y="332" class="b">Each ends with "From 8am"</text>
  <text x="446" y="362" class="m">Or a question, if a fact is missing</text></svg>
