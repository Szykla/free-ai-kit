<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" role="img" aria-labelledby="t d">
  <title id="t">A checked answer</title>
  <desc id="d">An AI reply with two claims highlighted. The first, "order 5 sacks", has a pink Wrong tag and a fix: 6 sacks, checked with code. The second, the labelling rule, has a cyan Checked tag with the official source and date. A verdict line sits below.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1530; }
    .h { font-size: 22px; font-weight: 700; }
    .b { font-size: 18px; }
    .m { font-size: 16px; fill: #5d5472; }
    .tag { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="800" height="470" fill="#fbf8ff"/>
  <text x="30" y="44" class="h">Maria's answer, checked</text>
  <rect x="30" y="64" width="740" height="270" rx="14" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
  <text x="54" y="98" class="m">Example reply</text>
  <rect x="48" y="114" width="322" height="36" rx="6" fill="#fde8f3"/>
  <text x="56" y="139" class="b">132 kg a week, so order 5 sacks.</text>
  <rect x="380" y="116" width="74" height="30" rx="15" fill="#e83e9c"/>
  <text x="394" y="137" class="tag">Wrong</text>
  <text x="470" y="139" class="b">Fix: 6 sacks (code: 5.28,</text>
  <text x="470" y="163" class="b">rounded up)</text>
  <line x1="54" y1="190" x2="746" y2="190" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="48" y="206" width="420" height="36" rx="6" fill="#e3f7fb"/>
  <text x="56" y="231" class="b">Loose bread: show allergen information...</text>
  <rect x="490" y="208" width="90" height="30" rx="15" fill="#16b8d4"/>
  <text x="503" y="229" class="tag">Checked</text>
  <text x="56" y="276" class="b">Source: national food agency page, opened 10 Nov</text>
  <text x="56" y="306" class="m">Every number, rule, name and link gets a mark.</text>
  <rect x="30" y="356" width="740" height="90" rx="14" fill="#ffffff" stroke="#5b2a8c" stroke-width="3"/>
  <text x="54" y="392" class="h" style="fill:#5b2a8c">Verdict</text>
  <text x="54" y="424" class="b">Sacks: 6, checked with code. Rule: checked on official site.</text></svg>
