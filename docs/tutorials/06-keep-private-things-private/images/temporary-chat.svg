<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" role="img" aria-labelledby="t d">
  <title id="t">Where the temporary chat button usually is</title>
  <desc id="d">Simplified drawing of a new chat screen. At the top right, a small icon for a temporary or incognito chat is highlighted by pink callout 1. The message box is empty. Simplified drawing. Your screen may look different.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1530; }
    .b { font-size: 18px; }
    .m { font-size: 16px; fill: #5d5472; }
    .n { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>
  <rect width="800" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="330" rx="16" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="44" y="40" width="120" height="30" rx="8" fill="#e9e2f5"/>
  <text x="56" y="61" class="m">New chat</text>
  <circle cx="726" cy="56" r="22" fill="#fde8f3" stroke="#e83e9c" stroke-width="4"/>
  <path d="M714 66 L714 52 Q714 42 726 42 Q738 42 738 52 L738 66 L734 62 L730 66 L726 62 L722 66 L718 62 Z" fill="#5d5472"/>
  <line x1="704" y1="66" x2="640" y2="110" stroke="#e83e9c" stroke-width="3"/>
  <circle cx="626" cy="120" r="18" fill="#e83e9c"/>
  <text x="626" y="127" class="n">1</text>
  <text x="370" y="128" class="b">Temporary or incognito</text>
  <text x="370" y="152" class="m">Ghost icon in Claude</text>
  <text x="400" y="200" class="b" style="text-anchor:middle; fill:#5d5472">How can I help?</text>
  <rect x="60" y="260" width="680" height="64" rx="16" fill="#ffffff" stroke="#c9bfdc" stroke-width="2"/>
  <text x="90" y="299" class="m">Message box</text>
  <text x="20" y="384" class="m">Simplified drawing. Your screen may look different. In Gemini, it sits next to New chat.</text></svg>
