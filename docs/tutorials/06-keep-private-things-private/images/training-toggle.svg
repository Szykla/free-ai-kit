<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" role="img" aria-labelledby="t d">
  <title id="t">Where the training switch usually is</title>
  <desc id="d">Simplified drawing of a settings page. A left menu lists sections, with the data or privacy section highlighted by pink callout 1. On the right, a switch about using your chats to improve models is highlighted by pink callout 2. Simplified drawing. Your screen may look different.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1530; }
    .b { font-size: 18px; }
    .m { font-size: 16px; fill: #5d5472; }
    .n { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>
  <rect width="800" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="350" rx="16" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
