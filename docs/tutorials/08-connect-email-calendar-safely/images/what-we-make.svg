<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" role="img" aria-labelledby="t d">
  <title id="t">A connected inbox that reads only and asks first</title>
  <desc id="d">A chat window. Maria's message: Which suppliers emailed me this week? An approval card: Gmail wants to read messages, with buttons Allow once and Deny. Below, the reply lists three supplier emails: two from Millbrook Supplies and one about packaging, each with a day and one line. A label reads Reads only. Asks first.</desc>
  <rect width="800" height="520" fill="#fbf8ff"/>
  <rect x="40" y="20" width="720" height="480" rx="18" fill="#ffffff" stroke="#e9e2f5" stroke-width="3"/>
  <g font-family="system-ui, sans-serif">
    <rect x="330" y="44" width="400" height="56" rx="14" fill="#e9e2f5"/>
    <text x="350" y="79" font-size="18" fill="#1d1530">Which suppliers emailed me this week?</text>
    <rect x="70" y="122" width="460" height="120" rx="14" fill="#ffffff" stroke="#e83e9c" stroke-width="3"/>
    <text x="94" y="158" font-size="19" font-weight="700" fill="#1d1530">Gmail wants to read messages</text>
    <rect x="94" y="180" width="150" height="42" rx="10" fill="#5b2a8c"/>
    <text x="169" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Allow once</text>
    <rect x="260" y="180" width="110" height="42" rx="10" fill="#ffffff" stroke="#5d5472" stroke-width="2"/>
    <text x="315" y="208" text-anchor="middle" font-size="18" fill="#1d1530">Deny</text>
    <text x="70" y="290" font-size="18" fill="#5d5472">Example reply. Yours will be worded differently.</text>
    <text x="70" y="326" font-size="19" fill="#1d1530">1. Millbrook Supplies, Tue: flour price goes up</text>
    <text x="70" y="362" font-size="19" fill="#1d1530">2. Millbrook Supplies, Wed: butter delivery at 8 am</text>
    <text x="70" y="398" font-size="19" fill="#1d1530">3. Packaging, Thu: box order shipped</text>
    <rect x="250" y="430" width="300" height="46" rx="12" fill="#e3f7fb" stroke="#16b8d4" stroke-width="2"/>
    <text x="400" y="460" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1530">Reads only. Asks first.</text>
  </g></svg>
