<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" role="img" aria-labelledby="t d">
  <title id="t">Maria's morning brief</title>
  <desc id="d">A phone notification titled Morning brief. Five numbered lines: 1 Millbrook Supplies asks about December price, 2 customer asks for a cake for 30 on Saturday, 3 decision: butter delivery at 8 am, yes or no, 4 calendar clash at 10:00, 5 FYI box order shipped. A label reads Read only. Sent only to you.</desc>
  <rect width="800" height="540" fill="#fbf8ff"/>
  <rect x="180" y="20" width="440" height="500" rx="40" fill="#ffffff" stroke="#1d1530" stroke-width="4"/>
  <rect x="340" y="38" width="120" height="10" rx="5" fill="#e9e2f5"/>
  <g font-family="system-ui, sans-serif">
    <rect x="205" y="70" width="390" height="370" rx="18" fill="#ffffff" stroke="#e9e2f5" stroke-width="3"/>
    <circle cx="232" cy="100" r="12" fill="#5b2a8c"/>
    <text x="254" y="107" font-size="20" font-weight="700" fill="#1d1530">Morning brief</text>
    <text x="575" y="107" text-anchor="end" font-size="16" fill="#5d5472">7:05</text>
    <line x1="220" y1="125" x2="580" y2="125" stroke="#e9e2f5" stroke-width="2"/>
    <text x="222" y="160" font-size="16" font-weight="700" fill="#5b2a8c">NEEDS A REPLY</text>
    <text x="222" y="188" font-size="17" fill="#1d1530">1. Millbrook Supplies: December price?</text>
    <text x="222" y="216" font-size="17" fill="#1d1530">2. Cake for 30 on Saturday?</text>
    <text x="222" y="252" font-size="16" font-weight="700" fill="#5b2a8c">NEEDS A DECISION</text>
    <text x="222" y="280" font-size="17" fill="#1d1530">3. Butter at 8 am: yes or no?</text>
    <text x="222" y="316" font-size="16" font-weight="700" fill="#5b2a8c">TODAY</text>
    <text x="222" y="344" font-size="17" fill="#1d1530">4. 10:00 call clashes with order</text>
    <text x="222" y="380" font-size="16" font-weight="700" fill="#5b2a8c">FYI</text>
    <text x="222" y="408" font-size="17" fill="#1d1530">5. Box order shipped</text>
    <rect x="230" y="458" width="340" height="40" rx="12" fill="#e3f7fb" stroke="#16b8d4" stroke-width="2"/>
    <text x="400" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#1d1530">Read only. Sent only to you.</text>
  </g></svg>
