<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The finished result: an order table and a draft email, waiting for you</title>
  <desc id="d">Left: a table of four items with order quantities and a total of 414.90 pounds. Right: an email draft to the supplier, marked Draft, not sent. A pink banner says the agent stopped and is waiting for you to check and send.</desc>
  <rect width="800" height="500" fill="#fbf8ff"/>
  <rect x="20" y="20" width="760" height="52" rx="12" fill="#fde8f3" stroke="#e83e9c" stroke-width="2"/>
  <text x="400" y="53" text-anchor="middle" font-size="19" font-weight="700" fill="#1d1530">Agent stopped. Waiting for you to check and send.</text>
  <g font-size="17" fill="#1d1530">
    <rect x="20" y="92" width="400" height="330" rx="14" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <text x="40" y="126" font-size="19" font-weight="700">Monday order</text>
    <text x="40" y="162" fill="#5d5472" font-weight="700">Item</text><text x="290" y="162" fill="#5d5472" font-weight="700" text-anchor="end">Order</text><text x="400" y="162" fill="#5d5472" font-weight="700" text-anchor="end">Cost</text>
    <line x1="40" y1="174" x2="400" y2="174" stroke="#e9e2f5" stroke-width="2"/>
    <text x="40" y="204">White flour</text><text x="290" y="204" text-anchor="end">5 sacks</text><text x="400" y="204" text-anchor="end">£92.50</text>
    <text x="40" y="240">Wholemeal</text><text x="290" y="240" text-anchor="end">3 sacks</text><text x="400" y="240" text-anchor="end">£57.60</text>
    <text x="40" y="276">Rye flour</text><text x="290" y="276" text-anchor="end">1 sack</text><text x="400" y="276" text-anchor="end">£16.80</text>
    <text x="40" y="312">Butter</text><text x="290" y="312" text-anchor="end">4 boxes</text><text x="400" y="312" text-anchor="end">£248.00</text>
    <line x1="40" y1="330" x2="400" y2="330" stroke="#e9e2f5" stroke-width="2"/>
    <text x="40" y="362" font-weight="700">Total</text><text x="400" y="362" font-weight="700" text-anchor="end">£414.90</text>
    <text x="40" y="402" fill="#5d5472" font-size="16">Unsure about: nothing flagged</text>

    <rect x="440" y="92" width="340" height="330" rx="14" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <rect x="460" y="108" width="150" height="30" rx="15" fill="#e3f7fb" stroke="#16b8d4" stroke-width="2"/>
    <text x="535" y="129" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1530">DRAFT. Not sent.</text>
    <text x="460" y="168" fill="#5d5472" font-size="16">To: orders@example.com</text>
    <text x="460" y="194" fill="#5d5472" font-size="16">Subject: Monday order</text>
    <line x1="460" y1="208" x2="760" y2="208" stroke="#e9e2f5" stroke-width="2"/>
    <text x="460" y="238">Hello, please deliver on</text>
    <text x="460" y="262">Wednesday morning:</text>
    <text x="460" y="292">5 sacks white flour,</text>
    <text x="460" y="316">3 sacks wholemeal,</text>
    <text x="460" y="340">1 sack rye, 4 boxes butter.</text>
    <text x="460" y="370">Thank you, Maria</text>
  </g>
  <text x="400" y="460" text-anchor="middle" font-size="17" fill="#5d5472">You read it, fix it if needed, and press Send yourself.</text></svg>
