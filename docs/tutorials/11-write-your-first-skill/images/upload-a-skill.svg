    <circle cx="754" cy="122" r="18" fill="#e83e9c"/><text x="754" y="129" text-anchor="middle">2</text>
    <circle cx="754" cy="178" r="18" fill="#e83e9c"/><text x="754" y="185" text-anchor="middle">3</text>
