<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Simplified drawing of a Skills page in an assistant's Customize area</title>
  <desc id="d">A grey settings window with Customize open and Skills selected. Callout 1 marks the plus button. Callout 2 marks Create skill in the menu that opens. Callout 3 marks Upload a skill.</desc>
  <rect width="800" height="430" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="360" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="20" y="20" width="190" height="360" rx="14" fill="#f2eefa"/>
  <g font-size="18" fill="#1d1530">
    <text x="44" y="62" font-weight="700">Customize</text>
    <rect x="34" y="82" width="162" height="38" rx="8" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <text x="50" y="108" font-weight="700">Skills</text>
    <text x="50" y="150" fill="#5d5472">Connectors</text>
    <text x="240" y="66" font-weight="700" font-size="20">Skills</text>
    <rect x="686" y="40" width="44" height="40" rx="10" fill="#ffffff" stroke="#e83e9c" stroke-width="3"/>
    <path d="M708 50 v20 M698 60 h20" stroke="#1d1530" stroke-width="3" stroke-linecap="round"/>
    <rect x="470" y="92" width="260" height="120" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <rect x="478" y="100" width="244" height="44" rx="6" fill="#fde8f3" stroke="#e83e9c" stroke-width="3"/>
    <text x="494" y="129" font-weight="700">+ Create skill</text>
    <rect x="478" y="156" width="244" height="44" rx="6" fill="#ffffff" stroke="#e83e9c" stroke-width="3"/>
    <text x="494" y="185">Upload a skill</text>
    <rect x="240" y="100" width="210" height="60" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <rect x="240" y="176" width="210" height="60" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <rect x="240" y="252" width="210" height="60" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <g fill="#d9d2e6"><rect x="256" y="122" width="120" height="14" rx="7"/><rect x="256" y="198" width="140" height="14" rx="7"/><rect x="256" y="274" width="100" height="14" rx="7"/></g>
    <g fill="#e9e2f5"><rect x="404" y="120" width="32" height="18" rx="9"/><rect x="404" y="196" width="32" height="18" rx="9"/><rect x="404" y="272" width="32" height="18" rx="9"/></g>
  </g>
