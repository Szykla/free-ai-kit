<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Simplified drawing of the Cloudflare Pages upload screen</title>
  <desc id="d">A grey dashboard. Callout 1 marks the project name box. Callout 2 marks the large drop area where you drag your site folder. Callout 3 marks the Deploy site button below it.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="44" rx="14" fill="#e9e2f5"/>
  <circle cx="46" cy="42" r="7" fill="#c9c2d6"/><circle cx="68" cy="42" r="7" fill="#c9c2d6"/><circle cx="90" cy="42" r="7" fill="#c9c2d6"/>
  <rect x="20" y="64" width="160" height="356" fill="#f2eefa"/>
  <g fill="#d9d2e6"><rect x="40" y="90" width="110" height="14" rx="7"/><rect x="40" y="122" width="90" height="14" rx="7"/><rect x="40" y="154" width="120" height="14" rx="7"/><rect x="40" y="186" width="100" height="14" rx="7"/></g>
  <g font-size="18" fill="#1d1530">
    <text x="210" y="104" font-weight="700" font-size="20">Create a project</text>
    <text x="210" y="140" fill="#5d5472" font-size="16">Project name</text>
    <rect x="210" y="150" width="300" height="40" rx="8" fill="#ffffff" stroke="#e83e9c" stroke-width="3"/>
    <text x="224" y="177" fill="#1d1530">marias-bakery</text>
    <rect x="210" y="210" width="540" height="130" rx="12" fill="#ffffff" stroke="#e83e9c" stroke-width="3" stroke-dasharray="10 7"/>
    <path d="M480 238 v38 M464 260 l16 16 l16 -16" stroke="#5d5472" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="306" text-anchor="middle" fill="#5d5472">Drag and drop your folder here</text>
    <rect x="210" y="360" width="170" height="44" rx="8" fill="#e83e9c"/>
    <text x="295" y="388" text-anchor="middle" fill="#ffffff" font-weight="700">Deploy site</text>
  </g>
  <g font-size="18" font-weight="700" fill="#ffffff">
    <circle cx="540" cy="170" r="18" fill="#e83e9c"/><text x="540" y="177" text-anchor="middle">1</text>
    <circle cx="770" cy="275" r="18" fill="#e83e9c"/><text x="770" y="282" text-anchor="middle">2</text>
    <circle cx="408" cy="382" r="18" fill="#e83e9c"/><text x="408" y="389" text-anchor="middle">3</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-size="16" fill="#5d5472">Simplified drawing. Your screen may look different.</text></svg>
