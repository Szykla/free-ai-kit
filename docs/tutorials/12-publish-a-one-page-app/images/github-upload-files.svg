<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Simplified drawing of a GitHub repository page</title>
  <desc id="d">A grey repository page. Callout 1 marks the Add file button above the file list. Callout 2 marks Upload files in the menu that opens under it.</desc>
  <rect width="800" height="430" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="360" rx="14" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="44" rx="14" fill="#e9e2f5"/>
  <circle cx="46" cy="42" r="7" fill="#c9c2d6"/><circle cx="68" cy="42" r="7" fill="#c9c2d6"/><circle cx="90" cy="42" r="7" fill="#c9c2d6"/>
  <g font-size="18" fill="#1d1530">
    <text x="50" y="104" font-weight="700" font-size="20">your-name / marias-bakery-site</text>
    <rect x="50" y="124" width="110" height="36" rx="8" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <text x="105" y="148" text-anchor="middle" fill="#5d5472" font-size="16">main</text>
    <rect x="520" y="124" width="130" height="36" rx="8" fill="#ffffff" stroke="#e83e9c" stroke-width="3"/>
    <text x="585" y="148" text-anchor="middle">Add file</text>
    <rect x="664" y="124" width="90" height="36" rx="8" fill="#d9d2e6"/>
    <rect x="460" y="168" width="230" height="96" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <text x="480" y="203" fill="#5d5472">Create new file</text>
    <rect x="466" y="216" width="218" height="40" rx="6" fill="#fde8f3" stroke="#e83e9c" stroke-width="3"/>
    <text x="480" y="243" font-weight="700">Upload files</text>
    <rect x="50" y="180" width="390" height="180" rx="10" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <g fill="#d9d2e6"><rect x="70" y="204" width="180" height="14" rx="7"/><rect x="70" y="244" width="150" height="14" rx="7"/><rect x="70" y="284" width="200" height="14" rx="7"/><rect x="70" y="324" width="120" height="14" rx="7"/></g>
  </g>
  <g font-size="18" font-weight="700" fill="#ffffff">
    <circle cx="520" cy="112" r="18" fill="#e83e9c"/><text x="520" y="119" text-anchor="middle">1</text>
    <circle cx="710" cy="236" r="18" fill="#e83e9c"/><text x="710" y="243" text-anchor="middle">2</text>
  </g>
  <text x="400" y="412" text-anchor="middle" font-size="16" fill="#5d5472">Simplified drawing. Your screen may look different.</text></svg>
