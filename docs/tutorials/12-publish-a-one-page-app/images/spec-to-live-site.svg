<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">From a one-paragraph spec to a live site</title>
  <desc id="d">Six steps in order: write a spec, ask a free chat AI, save index.html, preview it on computer and phone, publish on Cloudflare Pages, keep a copy on GitHub.</desc>
  <rect width="800" height="460" fill="#fbf8ff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5b2a8c"/></marker>
  </defs>
  <g font-size="18" fill="#1d1530">
    <rect x="30" y="40" width="220" height="150" rx="16" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="62" cy="72" r="18" fill="#5b2a8c"/><text x="62" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
    <text x="92" y="79" font-weight="700">Write a spec</text>
    <text x="50" y="120" fill="#5d5472" font-size="17">One paragraph: who it</text>
    <text x="50" y="145" fill="#5d5472" font-size="17">is for, what is on the</text>
    <text x="50" y="170" fill="#5d5472" font-size="17">page, the real facts.</text>

    <rect x="290" y="40" width="220" height="150" rx="16" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="322" cy="72" r="18" fill="#5b2a8c"/><text x="322" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
    <text x="352" y="79" font-weight="700">Ask a free AI</text>
    <text x="310" y="120" fill="#5d5472" font-size="17">"One self-contained</text>
    <text x="310" y="145" fill="#5d5472" font-size="17">index.html file, no</text>
    <text x="310" y="170" fill="#5d5472" font-size="17">outside links."</text>

    <rect x="550" y="40" width="220" height="150" rx="16" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="582" cy="72" r="18" fill="#5b2a8c"/><text x="582" y="78" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
    <text x="612" y="79" font-weight="700">Save the file</text>
    <text x="570" y="120" fill="#5d5472" font-size="17">index.html inside its</text>
    <text x="570" y="145" fill="#5d5472" font-size="17">own folder on your</text>
    <text x="570" y="170" fill="#5d5472" font-size="17">computer.</text>

    <rect x="550" y="260" width="220" height="150" rx="16" fill="#e3f7fb" stroke="#16b8d4" stroke-width="2"/>
    <circle cx="582" cy="292" r="18" fill="#5b2a8c"/><text x="582" y="298" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
    <text x="612" y="299" font-weight="700">Preview it</text>
    <text x="570" y="340" fill="#5d5472" font-size="17">Open it in a browser.</text>
    <text x="570" y="365" fill="#5d5472" font-size="17">Check every fact and</text>
    <text x="570" y="390" fill="#5d5472" font-size="17">the phone layout.</text>

    <rect x="290" y="260" width="220" height="150" rx="16" fill="#fde8f3" stroke="#e83e9c" stroke-width="3"/>
    <circle cx="322" cy="292" r="18" fill="#e83e9c"/><text x="322" y="298" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
    <text x="352" y="299" font-weight="700">Publish</text>
    <text x="310" y="340" fill="#5d5472" font-size="17">Drag the folder into</text>
    <text x="310" y="365" fill="#5d5472" font-size="17">Cloudflare Pages. Get</text>
    <text x="310" y="390" fill="#5d5472" font-size="17">a .pages.dev address.</text>

    <rect x="30" y="260" width="220" height="150" rx="16" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="62" cy="292" r="18" fill="#5b2a8c"/><text x="62" y="298" text-anchor="middle" fill="#ffffff" font-weight="700">6</text>
    <text x="92" y="299" font-weight="700">Keep a copy</text>
    <text x="50" y="340" fill="#5d5472" font-size="17">Upload the same file</text>
    <text x="50" y="365" fill="#5d5472" font-size="17">to a GitHub repository</text>
    <text x="50" y="390" fill="#5d5472" font-size="17">so it stays yours.</text>
  </g>
  <g stroke="#5b2a8c" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="252" y1="115" x2="286" y2="115"/>
    <line x1="512" y1="115" x2="546" y2="115"/>
    <line x1="660" y1="192" x2="660" y2="256"/>
    <line x1="548" y1="335" x2="514" y2="335"/>
    <line x1="288" y1="335" x2="254" y2="335"/>
  </g>
  <text x="400" y="445" text-anchor="middle" font-size="16" fill="#5d5472">No coding, no git, no paid plan. Steps 5 and 6 each need a free account.</text></svg>
