<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Simplified drawing of a database Policies view</title>
  <desc id="d">A generic grey window titled Policies with a table of four columns: Policy name, Command, Applies to, and Rule expression. Four rows belong to the orders table, one each for SELECT, INSERT, UPDATE and DELETE. Pink callout 1 points at the Rule expression column, where each rule checks that the user owns the row. Caption: Simplified drawing. Your screen may look different.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <rect x="20" y="20" width="760" height="370" rx="12" fill="#fbf8ff" stroke="#e9e2f5" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="50" rx="12" fill="#e9e2f5"/>
  <text x="44" y="53" font-size="20" font-weight="700" fill="#1d1530">Policies</text>
  <text x="560" y="53" font-size="17" fill="#5d5472">Table: orders</text>
  <!-- header -->
  <text x="44" y="105" font-size="17" font-weight="700" fill="#5d5472">Policy name</text>
  <text x="250" y="105" font-size="17" font-weight="700" fill="#5d5472">Command</text>
  <text x="380" y="105" font-size="17" font-weight="700" fill="#5d5472">Applies to</text>
  <text x="545" y="105" font-size="17" font-weight="700" fill="#5d5472">Rule expression</text>
  <line x1="40" y1="118" x2="760" y2="118" stroke="#e9e2f5" stroke-width="2"/>
  <g font-size="17" fill="#1d1530">
    <text x="44" y="152">Read own orders</text><text x="250" y="152">SELECT</text><text x="380" y="152">authenticated</text>
    <text x="44" y="200">Add own orders</text><text x="250" y="200">INSERT</text><text x="380" y="200">authenticated</text>
    <text x="44" y="248">Change own orders</text><text x="250" y="248">UPDATE</text><text x="380" y="248">authenticated</text>
    <text x="44" y="296">Delete own orders</text><text x="250" y="296">DELETE</text><text x="380" y="296">authenticated</text>
  </g>
  <g fill="#e9e2f5"><rect x="545" y="134" width="200" height="26" rx="6"/><rect x="545" y="182" width="200" height="26" rx="6"/><rect x="545" y="230" width="200" height="26" rx="6"/><rect x="545" y="278" width="200" height="26" rx="6"/></g>
  <g font-size="16" fill="#1d1530"><text x="555" y="153">owner = user</text><text x="555" y="201">owner = user</text><text x="555" y="249">owner = user</text><text x="555" y="297">owner = user</text></g>
  <!-- highlight + callout -->
  <rect x="535" y="124" width="220" height="190" rx="8" fill="none" stroke="#e83e9c" stroke-width="4"/>
  <circle cx="755" cy="124" r="20" fill="#e83e9c"/>
  <text x="755" y="131" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="44" y="352" font-size="17" fill="#1d1530">1  Each rule must compare the signed-in user with the row's owner.</text>
  <text x="400" y="420" font-size="16" fill="#5d5472" text-anchor="middle">Simplified drawing. Your screen may look different.</text></svg>
