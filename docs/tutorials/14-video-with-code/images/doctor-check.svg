<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Simplified drawing of the doctor check in a terminal</title>
  <desc id="d">A generic terminal window. The command npx hyperframes doctor is typed at the top. Below it, a list of checks with ticks: Version, Node.js, FFmpeg, FFprobe, Chrome, and Docker marked optional for this lesson. Pink callout 1 surrounds the Node.js, FFmpeg, FFprobe and Chrome lines, which all need ticks. Caption: Simplified drawing. Your screen may look different.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <rect x="40" y="20" width="720" height="360" rx="12" fill="#1d1530"/>
  <rect x="40" y="20" width="720" height="40" rx="12" fill="#5d5472"/>
  <g fill="#e9e2f5"><circle cx="70" cy="40" r="7"/><circle cx="94" cy="40" r="7"/><circle cx="118" cy="40" r="7"/></g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#ffffff">
    <text x="70" y="100">$ npx hyperframes doctor</text>
    <text x="90" y="145">&#10003; Version</text>
    <text x="90" y="185">&#10003; Node.js     v22 or newer</text>
    <text x="90" y="220">&#10003; FFmpeg</text>
    <text x="90" y="255">&#10003; FFprobe</text>
    <text x="90" y="290">&#10003; Chrome</text>
    <text x="90" y="335" fill="#e9e2f5">- Docker      (not needed here)</text>
  </g>
  <rect x="78" y="162" width="440" height="140" rx="8" fill="none" stroke="#e83e9c" stroke-width="4"/>
  <circle cx="518" cy="162" r="20" fill="#e83e9c"/>
  <text x="518" y="169" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="400" y="412" font-size="16" fill="#5d5472" text-anchor="middle">Simplified drawing. Your screen may look different.</text></svg>
