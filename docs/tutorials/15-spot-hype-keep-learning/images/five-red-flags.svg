<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Five red flags in AI videos and posts</title>
  <desc id="d">A checklist of five red flags, each with a short example. 1: Secret or magic prompt, such as a title promising a secret prompt. 2: No real screen or real prompt shown, only talk or stock footage. 3: Only wins, with no failures or limits. 4: Hidden money, such as an undisclosed sponsor, a sales webinar, or a free certificate that costs. 5: Old or undated, especially tool tours from before December 2025.</desc>
  <rect width="800" height="470" fill="#fbf8ff"/>
  <text x="400" y="42" font-size="23" font-weight="700" fill="#1d1530" text-anchor="middle">Five red flags</text>
  <g font-size="18">
    <rect x="40" y="65" width="720" height="68" rx="12" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="80" cy="99" r="20" fill="#e83e9c"/><text x="80" y="106" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="118" y="94" font-weight="700" fill="#1d1530">Secret or magic prompt</text><text x="118" y="120" font-size="16" fill="#5d5472">"The one prompt that does it all"</text>
    <rect x="40" y="143" width="720" height="68" rx="12" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="80" cy="177" r="20" fill="#e83e9c"/><text x="80" y="184" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="118" y="172" font-weight="700" fill="#1d1530">No real screen, no real prompt</text><text x="118" y="198" font-size="16" fill="#5d5472">Talk and big numbers, but you never see it work</text>
    <rect x="40" y="221" width="720" height="68" rx="12" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="80" cy="255" r="20" fill="#e83e9c"/><text x="80" y="262" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="118" y="250" font-weight="700" fill="#1d1530">Only wins</text><text x="118" y="276" font-size="16" fill="#5d5472">No failures, no limits, no "this didn't work"</text>
    <rect x="40" y="299" width="720" height="68" rx="12" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="80" cy="333" r="20" fill="#e83e9c"/><text x="80" y="340" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="118" y="328" font-weight="700" fill="#1d1530">Hidden money</text><text x="118" y="354" font-size="16" fill="#5d5472">Undisclosed sponsor, sales webinar, "free" certificate that costs</text>
    <rect x="40" y="377" width="720" height="68" rx="12" fill="#ffffff" stroke="#e9e2f5" stroke-width="2"/>
    <circle cx="80" cy="411" r="20" fill="#e83e9c"/><text x="80" y="418" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="118" y="406" font-weight="700" fill="#1d1530">Old or undated</text><text x="118" y="432" font-size="16" fill="#5d5472">Tool tours from before December 2025, or no date at all</text>
  </g></svg>
